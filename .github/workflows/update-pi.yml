name: Update Pi

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.74.0 or v0.74.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run update script
        id: update-script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_OVERRIDE: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          bash .github/scripts/update-pi.sh

      - name: Update flake inputs
        run: |
          set -euo pipefail
          nix flake update

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          if [[ "${UPDATE_REQUIRED:-false}" == "true" ]]; then
            echo "pi_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "pi_updated=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- flake.lock; then
            echo "flake_lock_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "flake_lock_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet; then
            echo "any_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build verification
        if: steps.changes.outputs.any_changes == 'true'
        run: |
          set -euo pipefail
          nix build .#pi --no-link
          nix build .#default --no-link

      - name: Prepare PR metadata
        if: steps.changes.outputs.any_changes == 'true'
        id: pr-meta
        run: |
          set -euo pipefail

          if [[ "${UPDATE_REQUIRED:-false}" == "true" ]]; then
            title="chore: update pi to v${NEW_VERSION}"
            commit_message="chore: update pi to v${NEW_VERSION}"
          else
            title="chore: update flake inputs"
            commit_message="chore: update flake inputs"
          fi

          body="Automated update generated by \`.github/workflows/update-pi.yml\`."
          body+=$'\n\n'

          if [[ "${UPDATE_REQUIRED:-false}" == "true" ]]; then
            body+="**Pi update:** v${NEW_VERSION}"$'\n'
            body+="- Updated \`packages/pi/package.nix\` (version, src hash, npmDepsHash)"$'\n'
            body+="- Vendored \`package-lock.v${NEW_VERSION}.json\`"$'\n'
          fi

          if [[ "${{ steps.changes.outputs.flake_lock_changed }}" == "true" ]]; then
            body+="- Updated \`flake.lock\` (nixpkgs, wrappers)"$'\n'
          fi

          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${commit_message}" >> "$GITHUB_OUTPUT"

          {
            echo 'body<<EOF'
            echo "${body}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.changes.outputs.any_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PI_UPDATER_TOKEN }}
          commit-message: ${{ steps.pr-meta.outputs.commit_message }}
          branch: automation/update-pi
          delete-branch: true
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PI_UPDATER_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --auto || true

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PI_UPDATER_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --admin
